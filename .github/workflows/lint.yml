name: Check patch series correctness

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - run: python3 -m unittest devutils.tests.test_check_stead_patch_syntax
    - run: python3 devutils/check_stead_patch_syntax.py
    - run: ./helium-chromium/devutils/lint.py -t .
